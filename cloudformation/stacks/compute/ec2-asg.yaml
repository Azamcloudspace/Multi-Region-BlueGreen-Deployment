AWSTemplateFormatVersion: 2010-09-09

Parameters:

  EnvironmentName:
    Type: String

  InstanceAmiId:
    Type: String

  InstanceType:
    Type: String

  PrivateSubnet1:
    Type: String

  PrivateSubnet2:
    Type: String

  VpcId:
    Type: String

  AlbSecurityGroup:
    Type: String

Resources:

  AppSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub "${EnvironmentName}-AppSecGroup"
      GroupDescription: Allow http access ALB Only
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          SourceSecurityGroupId: !Ref AlbSecurityGroup
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-app-sg"

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Sub "${EnvironmentName}-InstanceRole"
      Path: /

  TargetGroupBlue:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub "${EnvironmentName}-tg-blue"
      Port: 80
      Protocol: HTTP
      VpcId: !Ref VpcId
      HealthCheckPath: /
      HealthCheckProtocol: HTTP
      HealthCheckPort: traffic-port

  LaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateName: !Sub "${EnvironmentName}-App-lt"
      LaunchTemplateData:
        ImageId: !Ref InstanceAmiId
        InstanceType: !Ref InstanceType
        SecurityGroupIds:
          - !Ref AppSecurityGroup
        IamInstanceProfile:
          Arn: !GetAtt InstanceProfile.Arn
        UserData: !Base64 |
          #!/bin/bash
          set -xe

          # System update
          yum update -y

          # Install dependencies
          yum install -y aws-cli httpd ruby wget amazon-cloudwatch-agent

          # Start web server
          mkdir -p /var/www/html
          echo "<h1>App Running</h1>" > /var/www/html/index.html
          systemctl enable httpd
          systemctl start httpd

          # Get region (IMDSv2 compliant)
          TOKEN=$(curl -X PUT "http://169.254.169.254/latest/api/token" \
            -H "X-aws-ec2-metadata-token-ttl-seconds: 21600")

          REGION=$(curl -H "X-aws-ec2-metadata-token: $TOKEN" \
            -s http://169.254.169.254/latest/meta-data/placement/region)

          # Install CodeDeploy Agent with retry
          cd /tmp
          for i in {1..5}; do
            wget https://aws-codedeploy-${REGION}.s3.${REGION}.amazonaws.com/latest/install -O install && break
            sleep 5
          done

          chmod +x install
          ./install auto

          # Force agent to always restart if it crashes
          mkdir -p /etc/systemd/system/codedeploy-agent.service.d

          cat <<EOF > /etc/systemd/system/codedeploy-agent.service.d/override.conf
          [Service]
          Restart=always
          RestartSec=10
          EOF

          systemctl daemon-reexec
          systemctl daemon-reload

          # Enable and start agent
          systemctl enable codedeploy-agent
          systemctl restart codedeploy-agent

          # Verify agent is running
          sleep 10
          systemctl status codedeploy-agent || systemctl restart codedeploy-agent
          
          # Create CloudWatch Agent configuration
          sudo tee /opt/aws/amazon-cloudwatch-agent/etc/amazon-cloudwatch-agent.json > /dev/null <<'EOF'
          {"logs":{"logs_collected":{"files":{"collect_list":[{"file_path":"/var/log/app.log","log_group_name":"application-logs","log_stream_name":"{instance_id}","timestamp_format":"%Y-%m-%d %H:%M:%S"}]}}}}
          EOF
          # Start CloudWatch Agent
          /opt/aws/amazon-cloudwatch-agent/bin/amazon-cloudwatch-agent-ctl \
            -a fetch-config \
            -m ec2 \
            -c file:/opt/aws/amazon-cloudwatch-agent/etc/amazon-cloudwatch-agent.json \
            -s

  AutoScalingGroup:
    Type: AWS::AutoScaling::AutoScalingGroup
    Properties:
      AutoScalingGroupName: !Sub "${EnvironmentName}-app-asg"
      VPCZoneIdentifier:
        - !Ref PrivateSubnet1
        - !Ref PrivateSubnet2
      LaunchTemplate:
        LaunchTemplateId: !Ref LaunchTemplate
        Version: !GetAtt LaunchTemplate.LatestVersionNumber
      MinSize: '1'
      MaxSize: '3'
      DesiredCapacity: '1'
      TargetGroupARNs:
        - !Ref TargetGroupBlue
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-asg"
          PropagateAtLaunch: true

Outputs:

  AutoScalingGroupName:
    Value: !Ref AutoScalingGroup
    
  AppSecurityGroup:
    Value: !Ref AppSecurityGroup

  InstanceProfileName:
    Value: !Ref InstanceProfile

  TargetGroupBlue:
    Value: !Ref TargetGroupBlue
