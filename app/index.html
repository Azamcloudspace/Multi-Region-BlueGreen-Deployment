<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Green Deployment</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, #11998e, #38ef7d);
            color: white;
            text-align: center;
        }

        .container {
            background: rgba(0,0,0,0.2);
            padding: 40px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
            max-width: 500px;
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 10px;
        }

        .version {
            font-size: 1.5rem;
            margin-bottom: 20px;
            font-weight: bold;
        }

        button {
            padding: 12px 25px;
            border: none;
            border-radius: 25px;
            background: white;
            color: #11998e;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #eee;
        }

        .message {
            margin-top: 20px;
            font-size: 1.2rem;
            display: none;
        }

        .timestamp {
            margin-top: 20px;
            font-size: 0.9rem;
            opacity: 0.8;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🟢 Green Deployment</h1>
    <div class="version">Version 2.0</div>

    <p>Welcome to the new update. This version is live and ready.</p>

    <button onclick="showMessage()">Click to Interact</button>

    <div class="message" id="msg">
        ✅ You are successfully connected to the GREEN environment.
    </div>

    <div class="timestamp" id="time"></div>
</div>

<script>
    function showMessage() {
        const msg = document.getElementById('msg');
        msg.style.display = 'block';
    }

    function updateTime() {
        document.getElementById('time').textContent =
            "Page loaded: " + new Date().toLocaleString();
    }

    updateTime();
</script>

</body>
</html>
