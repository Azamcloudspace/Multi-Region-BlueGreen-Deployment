version: 0.2

phases:
  install:
    runtime-versions:
      python: 3.11

  build:
    commands:
      - aws deploy create-deployment-group \
          --application-name prod-CodeDeployApp \
          --deployment-group-name prod-dg \
          --service-role-arn arn:aws:iam::975050225555:role/prod-CodeDeployRole \
          --deployment-style deploymentType=BLUE_GREEN,deploymentOption=WITH_TRAFFIC_CONTROL \
          --auto-scaling-groups prod-app-asg \
          --load-balancer-info targetGroupInfoList=[{name=prod-tg-blue}] \
          --blue-green-deployment-configuration terminateBlueInstancesOnDeploymentSuccess={action=TERMINATE,terminationWaitTimeInMinutes=1},deploymentReadyOption={actionOnTimeout=CONTINUE_DEPLOYMENT},greenFleetProvisioningOption={action=COPY_AUTO_SCALING_GROUP} \
          --deployment-config-name CodeDeployDefault.AllAtOnce \
          --region us-east-1
      - aws deploy create-deployment-group \
          --application-name prod-CodeDeployApp \
          --deployment-group-name prod-dg \
          --service-role-arn arn:aws:iam::975050225555:role/prod-CodeDeployRole \
          --deployment-style deploymentType=BLUE_GREEN,deploymentOption=WITH_TRAFFIC_CONTROL \
          --auto-scaling-groups prod-app-asg \
          --load-balancer-info targetGroupInfoList=[{name=prod-tg-blue}] \
          --blue-green-deployment-configuration terminateBlueInstancesOnDeploymentSuccess={action=TERMINATE,terminationWaitTimeInMinutes=1},deploymentReadyOption={actionOnTimeout=CONTINUE_DEPLOYMENT},greenFleetProvisioningOption={action=COPY_AUTO_SCALING_GROUP} \
          --deployment-config-name CodeDeployDefault.AllAtOnce \
          --region us-west-1

artifacts:
  files:
    - '**/*'
