version: 0.2

env:
  variables:
    ENV_NAME: dev

phases:
  install:
    runtime-versions:
      python: 3.11
      
  pre_build:
    commands:
      - ACCOUNT_ID=$(aws sts get-caller-identity) --query Account --output text
  
  build:
    commands:
      - echo "Uploading nested stack templates to S3..."
      - aws s3 sync cloudformation/stacks/ s3://iac-bucket-azamcloud/
      - aws cloudformation deploy --template-file cloudformation/master/primary.yaml --stack-name ${ENV_NAME}-Multi-Region-BlueGreen-Stack-East --capabilities CAPABILITY_NAMED_IAM  --role-arn arn:aws:iam::$ACCOUNT_ID:role/cloudformationrole --parameter-overrides file://params/dev/dev_params_primary.json --region us-east-1
      - value1=$(aws ssm get-parameter --name "/${ENV_NAME}/myapp/primary/dbarn" --region us-east-1 --query 'Parameter.Value' --output text)
      - aws ssm put-parameter --name "/${ENV_NAME}/myapp/secondary/dbarn" --value "$value1" --type String --overwrite --region us-west-1
      - value2=$(aws ssm get-parameter --name "/${ENV_NAME}/dr/primary/alb/dns" --region us-east-1 --query 'Parameter.Value' --output text)
      - aws ssm put-parameter --name "/${ENV_NAME}/dr/primary/alb/dns" --value "$value2" --type String --overwrite --region us-west-1
      - value3=$(aws ssm get-parameter --name "/${ENV_NAME}/dr/primary/alb/zoneid" --region us-east-1 --query 'Parameter.Value' --output text)
      - aws ssm put-parameter --name "/${ENV_NAME}/dr/primary/alb/zoneid" --value "$value3" --type String --overwrite --region us-west-1
      - aws cloudformation deploy --template-file cloudformation/master/secondary.yaml --stack-name ${ENV_NAME}-Multi-Region-BlueGreen-Stack-West --capabilities CAPABILITY_NAMED_IAM --role-arn arn:aws:iam::$ACCOUNT_ID:role/cloudformationrole --parameter-overrides file://params/dev/dev_params_secondary.json --region us-west-1
      - aws s3api put-bucket-replication --bucket ${ENV_NAME}-primary-dr-bucket-us-east-1 --replication-configuration file://s3-replication-file/replication.json --region us-east-1

artifacts:
  files:
    - '**/*'
